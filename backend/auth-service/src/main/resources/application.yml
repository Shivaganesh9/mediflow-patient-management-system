server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: auth-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mediflow_auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: 2000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:20000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
    show-sql: ${JPA_SHOW_SQL:false}
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: ${MAX_PAGE_SIZE:100}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# Shared access-token revocation (Redis). Disabling it is insecure and for tests only.
security:
  revocation:
    enabled: ${SECURITY_REVOCATION_ENABLED:true}
    fail-open: ${SECURITY_REVOCATION_FAIL_OPEN:false}
    key-prefix: ${SECURITY_REVOCATION_KEY_PREFIX:mediflow:revoke:}
    marker-ttl: ${SECURITY_REVOCATION_MARKER_TTL:7d}
  login:
    max-failed-attempts: ${SECURITY_LOGIN_MAX_FAILED_ATTEMPTS:5}
    lockout-duration: ${SECURITY_LOGIN_LOCKOUT_DURATION:15m}

auth:
  refresh:
    # Duplicate refresh requests inside this window are treated as a retry, not as theft.
    reuse-grace: ${AUTH_REFRESH_REUSE_GRACE:10s}
  password-reset:
    token-ttl: ${AUTH_PASSWORD_RESET_TOKEN_TTL:30m}
    # Local/dev/test only: return the reset token in the API instead of sending mail.
    expose-token: ${AUTH_PASSWORD_RESET_EXPOSE_TOKEN:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState,ping
  health:
    # auth-service has no Kafka client on its classpath; keep the setting explicit for clarity.
    kafka:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  info:
    title: MediFlow Auth Service API
    description: Authentication, token, password and account-lifecycle APIs for MediFlow (register, login, token refresh/rotation, logout, current user, change/reset password, admin user management).
    version: 1.0
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.mediflow: INFO
    org.springframework.security: INFO
  pattern:
    # Correlate every log line with the originating request.
    level: "%5p [correlationId:%X{correlationId:-}]"
