spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: test-secret-key-for-auth-service-with-sufficient-length
  expiration: 900000
  refresh-expiration: 604800000

# Unit/integration tests run without Redis; revocation is covered by the
# Testcontainers-backed redis revocation tests.
security:
  revocation:
    enabled: false

# Tests run without Redis/Kafka.
management:
  health:
    redis:
      enabled: false
    kafka:
      enabled: false
