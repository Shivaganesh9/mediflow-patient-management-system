server:
  port: 8089
  shutdown: graceful

spring:
  application:
    name: notification-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: 2000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:20000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
    show-sql: ${JPA_SHOW_SQL:false}
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: ${MAX_PAGE_SIZE:100}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration/notification
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 2147483647
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:20000}
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:10000}
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:5000}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:100}
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.mediflow.*
        isolation.level: read_committed
    listener:
      ack-mode: record
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:1}

jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState,ping
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  info:
    title: MediFlow Notification Service API
    description: Notification inbox APIs (list, unread count, mark read).
    version: 1.0

# Shared access-token revocation (Redis). Every service must see the same revocation state.
security:
  revocation:
    enabled: ${SECURITY_REVOCATION_ENABLED:true}
    fail-open: ${SECURITY_REVOCATION_FAIL_OPEN:false}
    key-prefix: ${SECURITY_REVOCATION_KEY_PREFIX:mediflow:revoke:}
    marker-ttl: ${SECURITY_REVOCATION_MARKER_TTL:7d}

# Correlate every log line with the originating request/event.
logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-}]"
