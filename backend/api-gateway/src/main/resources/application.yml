server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    gateway:
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:10s}
        pool:
          max-connections: ${GATEWAY_POOL_MAX_CONNECTIONS:200}
          max-idle-time: 30s
          acquire-timeout: ${GATEWAY_POOL_ACQUIRE_TIMEOUT_MS:5000}
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_FIRST
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: patient-service
          uri: ${PATIENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/patients/**
        - id: appointment-service
          uri: ${APPOINTMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/appointments/**
        - id: medical-record-service
          uri: ${MEDICAL_RECORD_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/v1/medical-records/**
        - id: doctor-service
          uri: ${DOCTOR_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/doctors/**
        - id: billing-service
          uri: ${BILLING_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/invoices/**,/api/v1/payments/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/notifications/**
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/analytics/**
        - id: auth-api-docs
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/v3/api-docs/auth
          filters:
            - RewritePath=/v3/api-docs/auth, /v3/api-docs
        - id: patient-api-docs
          uri: ${PATIENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/v3/api-docs/patient
          filters:
            - RewritePath=/v3/api-docs/patient, /v3/api-docs
        - id: appointment-api-docs
          uri: ${APPOINTMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/v3/api-docs/appointment
          filters:
            - RewritePath=/v3/api-docs/appointment, /v3/api-docs
        - id: doctor-api-docs
          uri: ${DOCTOR_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/v3/api-docs/doctor
          filters:
            - RewritePath=/v3/api-docs/doctor, /v3/api-docs
        - id: billing-api-docs
          uri: ${BILLING_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/v3/api-docs/billing
          filters:
            - RewritePath=/v3/api-docs/billing, /v3/api-docs
        - id: analytics-api-docs
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/v3/api-docs/analytics
          filters:
            - RewritePath=/v3/api-docs/analytics, /v3/api-docs
        - id: notification-api-docs
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/v3/api-docs/notification
          filters:
            - RewritePath=/v3/api-docs/notification, /v3/api-docs
        - id: medical-record-api-docs
          uri: ${MEDICAL_RECORD_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/v3/api-docs/medical-record
          filters:
            - RewritePath=/v3/api-docs/medical-record, /v3/api-docs
        - id: swagger-ui-webjars
          uri: ${GATEWAY_SELF_URL:http://localhost:8080}
          predicates:
            - Path=/swagger-ui/**
          filters:
            - RewritePath=/swagger-ui/(?<segment>.*), /webjars/swagger-ui/${segment}
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
            allowedMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
            allowedHeaders: "Authorization,Content-Type,X-Requested-With,Idempotency-Key,X-Correlation-ID"
            exposedHeaders: "Idempotent-Replay,X-Correlation-ID"
            allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /v3/api-docs/auth
      - name: patient-service
        url: /v3/api-docs/patient
      - name: appointment-service
        url: /v3/api-docs/appointment
      - name: doctor-service
        url: /v3/api-docs/doctor
      - name: billing-service
        url: /v3/api-docs/billing
      - name: analytics-service
        url: /v3/api-docs/analytics
      - name: notification-service
        url: /v3/api-docs/notification
      - name: medical-record-service
        url: /v3/api-docs/medical-record
  info:
    title: MediFlow API Gateway
    description: Single entry point for all MediFlow backend services. Each microservice owns its OpenAPI spec (served at its own /v3/api-docs and /swagger-ui); this central UI aggregates all service specs via the gateway.
    version: 1.0

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-}]"
