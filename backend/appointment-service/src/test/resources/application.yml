spring:
  datasource:
    url: jdbc:h2:mem:appointmentdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  cloud:
    discovery:
      enabled: false

jwt:
  secret: test-secret-key-for-appointment-service-with-sufficient-length


# Unit/integration tests run without Redis; revocation is covered by the
# Testcontainers-backed redis revocation tests.
security:
  revocation:
    enabled: false

# Tests run without Redis/Kafka and without the outbox relay (no broker available).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState,ping
  health:
    redis:
      enabled: false
    kafka:
      enabled: false

outbox:
  publisher:
    enabled: false
