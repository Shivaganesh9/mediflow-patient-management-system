server:
  port: 8084

spring:
  application:
    name: appointment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/appointment_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  info:
    title: MediFlow Appointment Service API
    description: Appointment booking and management APIs (create, list, reschedule, cancel).
    version: 1.0

# Shared access-token revocation (Redis). Every service must see the same revocation state.
security:
  revocation:
    enabled: ${SECURITY_REVOCATION_ENABLED:true}
    fail-open: ${SECURITY_REVOCATION_FAIL_OPEN:false}
    key-prefix: ${SECURITY_REVOCATION_KEY_PREFIX:mediflow:revoke:}
    marker-ttl: ${SECURITY_REVOCATION_MARKER_TTL:7d}

spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  timeout: 2s
