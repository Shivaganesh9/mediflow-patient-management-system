server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: patient-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/patient_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: 2000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:20000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
    show-sql: ${JPA_SHOW_SQL:false}
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: ${MAX_PAGE_SIZE:100}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 2147483647
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:20000}
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:10000}
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:5000}

jwt:
  secret: ${JWT_SECRET}

services:
  # Auth-service owns identities; profile creation validates userId references against it.
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  # Bounded synchronous verification: one attempt, short timeouts, and a circuit breaker.
  auth-service-connect-timeout-ms: ${AUTH_SERVICE_CONNECT_TIMEOUT_MS:1000}
  auth-service-read-timeout-ms: ${AUTH_SERVICE_READ_TIMEOUT_MS:3000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState,ping
  health:
    # patient-service does not produce or consume domain events; a Kafka outage must not
    # mark it unhealthy.
    kafka:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  info:
    title: MediFlow Patient Service API
    description: Patient profile management APIs (CRUD, search, ownership-scoped access).
    version: 1.0

# Shared access-token revocation (Redis). Every service must see the same revocation state.
security:
  revocation:
    enabled: ${SECURITY_REVOCATION_ENABLED:true}
    fail-open: ${SECURITY_REVOCATION_FAIL_OPEN:false}
    key-prefix: ${SECURITY_REVOCATION_KEY_PREFIX:mediflow:revoke:}
    marker-ttl: ${SECURITY_REVOCATION_MARKER_TTL:7d}

# Correlate every log line with the originating request/event.
logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-}]"
