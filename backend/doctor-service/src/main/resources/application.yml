server:
  port: 8085

spring:
  application:
    name: doctor-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/doctor_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

springdoc:
  info:
    title: MediFlow Doctor Service API
    description: Doctor profile and schedule management APIs (profiles, availability, leaves).
    version: 1.0
