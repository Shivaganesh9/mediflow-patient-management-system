spring:
  datasource:
    url: jdbc:h2:mem:billingdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  cloud:
    discovery:
      enabled: false

jwt:
  secret: test-secret-key-for-billing-service-with-sufficient-length

eureka:
  client:
    enabled: false
