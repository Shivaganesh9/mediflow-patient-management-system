spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/medical_record_test
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  cloud:
    discovery:
      enabled: false

jwt:
  secret: test-secret-key-for-medical-record-service-with-sufficient-length

cors:
  allowed-origins: http://localhost:5173

eureka:
  client:
    enabled: false

# Unit/integration tests run without Redis; revocation is covered by the
# Testcontainers-backed redis revocation tests.
security:
  revocation:
    enabled: false

# Tests run without Redis/Kafka and without the outbox relay (no broker available).
management:
  health:
    redis:
      enabled: false
    kafka:
      enabled: false

outbox:
  publisher:
    enabled: false
