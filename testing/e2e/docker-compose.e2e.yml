# Cross-service E2E infrastructure.
#
# This stack is intentionally separate from docker-compose.yml: it exposes every dependency on an
# alternate port so a developer's normal dev stack (5432/6379/9092) keeps running untouched, and it
# keeps no named volumes, so `docker compose down -v` always returns a pristine database.
#
# Run through testing/e2e/run-e2e.mjs, which supplies the generated credentials. Never start this
# file on its own in a shared environment: it uses throwaway credentials and no TLS.
name: mediflow-e2e

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${E2E_DB_USERNAME:?run through testing/e2e/run-e2e.mjs}
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?run through testing/e2e/run-e2e.mjs}
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "54321:5432"
    volumes:
      - ../../infrastructure/docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${E2E_DB_USERNAME} -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:59092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx384m"
    ports:
      - "59092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 20s
