# HTTP edge for MediFlow (single VM).
#
# Serves the built SPA and proxies only `/api/` to the gateway. Actuator, OpenAPI
# docs and `/internal/**` are not proxied, so they stay unreachable from outside
# the VM even though every service exposes them on the compose network.
#
# For HTTPS, replace this file with https.conf.example and issue certificates as
# described in docs/production-deployment.md.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Container health probe used by docker-compose.prod.yml.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Single backend entry point. Everything else on the gateway (Actuator,
    # Swagger UI, /v3/api-docs) is deliberately not routed here.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # Hashed Vite assets are immutable.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Defence in depth: never expose service internals through the edge.
    location ~ ^/(actuator|v3/api-docs|swagger-ui|internal)(/|$) {
        return 404;
    }
}
