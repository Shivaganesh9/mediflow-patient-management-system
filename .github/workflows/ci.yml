name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ fast checks (every PR)
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Maven verify (full reactor)
        run: mvn -B -ntp verify

      - name: Build output stays out of git
        run: test -z "$(git status --porcelain)"

  frontend:
    name: Frontend build and type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mediflow-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/mediflow-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check the browser suite
        run: npm run typecheck:e2e

      - name: Build frontend
        run: npm run build

      - name: Build output stays out of git
        working-directory: .
        run: test -z "$(git status --porcelain)"

  browser-e2e:
    name: Browser E2E (Playwright, mocked API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mediflow-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/mediflow-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser workflows
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/mediflow-ui/e2e/report
          retention-days: 7

  release-checks:
    name: Release readiness (configuration and secret hygiene)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Static release checks
        run: node testing/release/check-release-readiness.mjs

      - name: Validate the development Compose file
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-placeholder
        run: docker compose config --quiet

      - name: Validate the E2E Compose file
        env:
          E2E_DB_USERNAME: postgres
          E2E_DB_PASSWORD: ci-only-placeholder
        run: docker compose -f testing/e2e/docker-compose.e2e.yml config --quiet

  docker-images:
    name: Docker images (backend services)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - patient-service
          - doctor-service
          - appointment-service
          - billing-service
          - medical-record-service
          - notification-service
          - analytics-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Package jars (skip tests)
        run: mvn -B -ntp -DskipTests package

      - name: Build ${{ matrix.service }} image
        run: docker build -t mediflow/${{ matrix.service }}:ci backend/${{ matrix.service }}

  # ------------------------------------------------------------------ heavy E2E (main / manual)
  cross-service-e2e:
    name: Cross-service E2E (PostgreSQL, Redis, Kafka)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run cross-service journeys (full profile)
        run: node testing/e2e/run-e2e.mjs --profile=full --build

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cross-service-e2e-logs
          path: testing/e2e/.logs
          retention-days: 7

  release-smoke:
    name: Release smoke (production configuration)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run the release smoke test
        run: node testing/release/smoke.mjs --build

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-logs
          path: testing/release/.logs
          retention-days: 7
